# The server's database SQL, fetched on the player's PC at the first start (server/fetch-sql.py), never shipped:
# it describes WoW's world (creatures, items, quests, their texts) as the vmangos project publishes it.
#   the world database: vmangos' world dump of 14 June 2021 (brotalnia/database, the dump vmangos' own
#   setup and the vmangos-deploy database image use), a 7z of one SQL file;
#   the rest (characters, logon, logs and every migration since that dump): vmangos core's sql/ at the core
#   commit the server is built from (release/build-env.sh VMANGOS_COMMIT), its migrations merged as its own
#   sql/migrations/merge.sh does.
# Every file made is checked against its sha256 below (the files the database image of the same core carries), so a
# download that differs never reaches the database. KEY=VALUE, sourced by server/pins.sh, read by fetch-sql.py.
