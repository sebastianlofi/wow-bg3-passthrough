# WOW-BG3 settings (read by tools/wowbg3-coord.py when BG3 starts). `key = value`, # starts a comment.

# Test commands in WoW's chat (/wowbg3 refill, tp, where, find, faction, level, xprate, learn, unlearn): 0 off, 1 on.
# On for the beta, so every /wowbg3 command works: they can set your WoW level and the server's XP
# rate, teleport you on the WoW map, change your WoW side and refill the party. Set it to 0 to leave
# only the everyday commands (/wowbg3 help, chat and the party ones: list, add, remove, pool, respec).
debug_commands = 1

# WoW's sound (zone music, ambience, spells) through your sound server: 1 on, 0 off.
wow_sound = 1

# WoW's view distance in yards (empty: benilla's own default). Lower it if video memory is short.
view_distance =

# Fast travel between the flight points your character has discovered: 0 off, 1 on.
# BG3's waypoint panel, pins on the map, or /wowbg3 waypoint. No flight master needed, free, not in a fight.
waypoints = 1

# BG3's camp and real long rests, with WoW's food and drink as the supplies: 0 off, 1 on.
# Off: camp is closed and `/wowbg3 refill` stands in for a long rest.
camp = 1

# WoW mobs use the BG3 abilities that match what they cast in WoW: 0 off, 1 on.
mob_abilities = 1

# Companions wait at camp and join through their own dialog, with popups explaining levels: 0 off, 1 on.
# Needs camp.
companions = 1

# Signature spells of your WoW class at BG3's level-ups, for Wizards and Sorcerers so far: 0 off, 1 on (not fully tested yet).
wow_spells = 0

# Mob stats from BG3's own enemy curves and your party, so WoW's mobs are real fights and a normal mob is quick:
# 0 off (the old HP and damage), 1 on. Not fully tested yet.
scaling = 1
# How hard they are, with scaling on: explorer, balanced, tactician or honour.
difficulty = balanced

# BG3's level that hosts the WoW world (do not change unless told to): the mod's own empty level.
host = WOWBG3_Azeroth_A
